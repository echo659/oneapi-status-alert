name: Monitor agentspace and bard

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: '仅发送测试邮件（不检查网站、不修改状态）'
        type: boolean
        default: false
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths:
      - monitor.py
      - test_monitor.py
      - .github/workflows/monitor.yml

permissions:
  contents: write

concurrency:
  group: oneapi-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Log trigger and Beijing time
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z'
      - name: Install browser
        if: github.event_name != 'workflow_dispatch' || !inputs.test_email
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run regression tests
        if: github.event_name == 'push'
        run: python -m unittest -v test_monitor
      - name: Check channels and send email on recovery
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.test_email)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py
      - name: Send test email
        if: github.event_name == 'workflow_dispatch' && inputs.test_email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py --test-email
      - name: Keep recovery state between runs
        if: "!cancelled() && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.test_email)"
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state"
            git pull --rebase origin main
            git push
          fi
      - name: Screenshot for troubleshooting
        if: "!cancelled() && github.event_name != 'push'"
        uses: actions/upload-artifact@v4
        with:
          name: status-page-debug
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3
