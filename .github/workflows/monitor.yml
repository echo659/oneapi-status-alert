name: Monitor agentspace and bard

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'  # Every 5 minutes, offset from busy minute 0 (UTC)

permissions:
  contents: write

concurrency:
  group: oneapi-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check channels and send email on recovery
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py
      - name: Keep recovery state between runs
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state [skip ci]"
            git push
          fi
      - name: Screenshot for troubleshooting
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-page-debug
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3
